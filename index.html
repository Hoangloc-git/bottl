<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>⛩️ Sakura Bot ⛩️</title>

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
    --sakura:#ffb7d5;
    --sakura-soft:#ffd6e8;
    --night:#0b0f1a;
    --indigo:#1a1f36;
}

*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Shippori Mincho', serif;
    background:
        radial-gradient(circle at top, #1a1f36 0%, #05070d 70%);
    color:var(--sakura);
}

/* ===== BACKGROUND LAYERS ===== */
.bg-glow{
    position:absolute;
    width:600px;height:600px;
    background:radial-gradient(circle,var(--sakura),transparent 70%);
    opacity:.08;
    filter:blur(60px);
    animation:float 18s infinite alternate;
}

@keyframes float{
    from{transform:translate(-100px,-50px)}
    to{transform:translate(100px,50px)}
}

/* ===== CENTER CONTENT ===== */
.center{
    position:relative;
    z-index:10;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.card{
    padding:60px 90px;
    border-radius:30px;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(12px);
    box-shadow:
        0 0 40px rgba(255,183,213,.15),
        inset 0 0 30px rgba(255,255,255,.05);
}

/* ===== TEXT ===== */
.title{
    font-size:72px;
    letter-spacing:4px;
    animation:breath 4s ease-in-out infinite;
}

@keyframes breath{
    0%,100%{text-shadow:0 0 10px var(--sakura)}
    50%{text-shadow:0 0 30px var(--sakura)}
}

.sub{
    margin-top:10px;
    font-size:26px;
    opacity:.85;
}

.version{
    margin-top:20px;
    font-size:18px;
    opacity:.6;
}

/* ===== TORII ===== */
.torii{
    font-size:42px;
    margin-bottom:20px;
    opacity:.9;
}

/* ===== SAKURA ===== */
.sakura{
    position:absolute;
    top:-40px;
    pointer-events:none;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{
        transform:translateY(-50px) rotate(0deg);
        opacity:0;
    }
    10%{opacity:1}
    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="bg-glow"></div>
<div class="bg-glow" style="right:0;top:40%"></div>

<div class="center">
    <div class="card">
        <div class="torii">⛩️</div>
        <div class="title">Bot Telegram</div>
        <div class="sub">Hoàng Lộc</div>
        <div class="version">bot 1.0  · Sakura Edition · Dùng /start để bắt đầu</div>
    </div>
</div>

<script>
const sakuraCount = 50;

for(let i=0;i<sakuraCount;i++){
    const s=document.createElement("div");
    s.className="sakura";
    s.innerText="🌸";
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=14+Math.random()*22+"px";
    s.style.animationDuration=8+Math.random()*12+"s";
    s.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(s);
}
</script>

</body>
</html>
